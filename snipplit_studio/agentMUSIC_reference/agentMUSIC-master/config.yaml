# Настройки видео
video:
  orientation: portrait       # portrait | landscape
  resolution: "1080x1920"     # portrait: 1080x1920, landscape: 1920x1080
  fps: 30

# Поиск футажей
footage:
  # Базовый список триггерных запросов
  # Claude дополняет этот список исходя из описания трека
  base_queries:
    - "sunset aesthetic"
    - "city night lights"
    - "nature calm forest"
    - "ocean waves"
    - "neon lights street"
    - "people dancing party"
    - "smoke cinematic"
    - "rain window"
    - "abstract motion"
    - "flowers blooming"
  # Пул для массовой закачки (scripts/fetch_footage_pool.py);
  # бот и prewarm читают только base_queries
  batch_queries:
    - "sunset aesthetic"
    - "city night lights"
    - "neon lights street"
    - "smoke cinematic"
    - "rain window"
    - "ocean waves"
    - "abstract motion"
    - "tokyo night street"
    - "shibuya crossing night"
    - "japan neon signs"
    - "tokyo aesthetic"
    - "japanese street night"
    - "night drive car"
    - "jdm car night"
    - "drift car smoke"
    - "night highway drive"
    - "sports car headlights night"
    - "mountain road drive"
  min_duration_sec: 10

# Караоке — настройки подсветки текста
karaoke:
  # Цвет подсветки активной строки (жёлтый по умолчанию)
  highlight_color: "0xFFD700"

# Папки
paths:
  output_dir: "./output"
  emotion_clips_dir: "./clips/emotions"
  streamer_clips_dir: "./clips/streamers"
  streamer_footage_dir: "./clips/footage"
  custom_footage_dir: "./clips/custom_footage"
  overlay_videos_dir: "./clips/overlay_videos"
  temp_dir: "./temp"
  fonts_dir: "./fonts"

# Chorus detection
chorus:
  min_duration: 15
  max_duration: 30
  n_segments: 10

# Очистка старых файлов
cleanup:
  session_max_age_days: 7
  max_choruses_per_user: 20
