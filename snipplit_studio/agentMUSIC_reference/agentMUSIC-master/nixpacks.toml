[phases.setup]
# deno — JS-рантайм для yt-dlp EJS (YouTube в 2026). streamrip/spotipy ставятся pip-ом.
nixPkgs = ["python311", "python311Packages.pip", "ffmpeg", "gcc", "deno"]

[phases.install]
cmds = ["python3.11 -m pip install setuptools wheel", "python3.11 -m pip install -r requirements.txt"]

[start]
cmd = "python3.11 bot.py"
